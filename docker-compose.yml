services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vincula-poa-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://database:5432/vincula_poa
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: docker-development-secret
      FRONTEND_URL: http://localhost:5173
      MAIL_TOKEN: ""
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: vincula-poa-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  database:
    image: postgis/postgis:17-3.5
    container_name: vincula-poa-database
    environment:
      POSTGRES_DB: vincula_poa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vincula_poa"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: